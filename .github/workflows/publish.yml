name: Publish to npm

# Only called by release-please.yml: npm trusted publishing is configured
# for that workflow, so a direct trigger here would be rejected by npm.
on:
  workflow_call:
    inputs:
      tag_name:
        description: Release tag created by Release Please
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.tag_name }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Verify tag matches package.json version
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: test "v$(node -p 'require("./package.json").version')" = "$TAG_NAME"

      - name: Build
        run: npm run build

      - name: Publish to npm (OIDC, no token)
        run: npm publish --provenance --access public
